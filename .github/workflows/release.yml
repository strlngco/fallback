name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    # Protect this environment in the repository settings to require approval
    # before anything is published.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

      # pnpm pack rewrites workspace: ranges, which npm publish would not.
      - name: Pack
        run: pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP/package"

      # npm trusted publishing (OIDC) needs npm 11.5.1 or later and no stored
      # token. NPM_TOKEN is only for a first publish, before the package exists
      # on npm and a trusted publisher can be configured for it; delete the
      # secret afterwards.
      - name: Publish
        working-directory: ${{ runner.temp }}/package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@^11.5.1
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          npm publish ./strlngco-fallback-*.tgz --provenance --access public
