name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      LEAK_PATTERNS:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The packages resolve each other through their built dist/, so build
      # before typechecking or testing.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/*.test.mjs
      - name: Install the packed CLI and run it
        run: node scripts/smoke-pack.mjs

  # The README walks Windows users through npm install -g, so the packed CLI
  # is installed and run there too. The unit suite assumes POSIX paths in
  # places and runs on Linux and macOS only.
  windows-install:
    name: Install on Windows (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the packed CLI and run it
        run: node scripts/smoke-pack.mjs

  leak-check:
    name: Leak check
    runs-on: ubuntu-latest
    steps:
      # On a pull request, check the PR's own commits rather than the merge
      # commit GitHub synthesizes under the PR author's account; that commit
      # never lands on main when the branch is fast-forwarded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check files, history, and package for private names and local paths
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          FORK_PULL_REQUEST: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ -z "$LEAK_PATTERNS" ]; then
            if [ "$FORK_PULL_REQUEST" = "true" ]; then
              echo "::warning::Secrets are not available to pull requests from forks; leak check skipped."
              exit 0
            fi
            echo "::error::The LEAK_PATTERNS repository secret is not set."
            exit 1
          fi
          node scripts/leak-check.mjs
